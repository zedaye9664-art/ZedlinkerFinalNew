<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZedLinker.store - WhatsApp & Telegram Directory</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&display=swap');
*{font-family:Inter,sans-serif}
.pink-grad{background:linear-gradient(135deg,#ff006a,#ff4081)}
</style>
</head>
<body class="bg-[#fcfcff] text-slate-900">
<header class="sticky top-0 z-30 bg-white/90 backdrop-blur border-b border-slate-100">
<div class="max-w-6xl mx-auto px-4 h-[64px] flex items-center justify-between">
<div class="flex items-center gap-3"><div class="w-10 h-10 rounded-xl pink-grad flex items-center justify-center text-white font-black text-xl">Z</div><div><div class="font-extrabold text-[18px] leading-none">ZedLinker<span class="font-normal text-[#ff006a]">.store</span></div><div class="text-[10px] text-slate-500">Pink + Blue - Field: data.url</div></div></div>
</div>
</header>

<div class="max-w-6xl mx-auto px-4 py-6">
<div class="flex gap-2 mb-6">
<input id="search" placeholder="Search groups..." class="flex-1 px-4 py-3 rounded-full border border-slate-200 text-[14px] outline-none focus:border-[#ff006a]">
<select id="filterType" class="px-4 py-3 rounded-full border border-slate-200 text-[13px] font-bold">
<option value="All">All Types</option>
<option value="WhatsApp Group">WhatsApp Group</option>
<option value="WhatsApp Channel">WhatsApp Channel</option>
<option value="Telegram Group">Telegram Group</option>
<option value="Telegram Channel">Telegram Channel</option>
</select>
</div>

<div id="loading" class="text-center py-20 text-slate-400 font-bold">Loading from links collection (field: url)...</div>
<div id="grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCsGgWhJrtuO4sYocovHSbu4LsLY4mtgNs",
  authDomain: "zedlinker-4545.firebaseapp.com",
  projectId: "zedlinker-4545",
  storageBucket: "zedlinker-4545.firebasestorage.app",
  messagingSenderId: "673513119995",
  appId: "1:673513119995:web:f4e2beb6e7e18d3222105e"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let allItems = [];

async function loadLinks(){
  const q = query(collection(db,"links"), orderBy("createdAt","desc"));
  const snapshot = await getDocs(q);
  
  // FIXED: Use real document ID dynamically - as per requirement 5
  const items = snapshot.docs.map((docSnap) => ({
    id: docSnap.id,
    ...docSnap.data()
  }));
  
  allItems = items;
  document.getElementById("loading").style.display="none";
  renderItems(items);
}

function renderItems(items){
  const grid = document.getElementById("grid");
  const searchVal = document.getElementById("search").value.toLowerCase();
  const filterVal = document.getElementById("filterType").value;
  
  let filtered = items.filter(l=>{
    if(filterVal!=="All" && (l.type||"")!==filterVal) return false;
    if(searchVal && !((l.name||"").toLowerCase().includes(searchVal))) return false;
    return true;
  });

  grid.innerHTML = filtered.map((item) => {
    // FIXED: Use real Firestore document ID dynamically - requirement 5
    // No /Follow, no name in URL, no combine
    const joinUrl = `/join.html?id=${encodeURIComponent(item.id)}`;

    return `
    <div class="bg-white border border-slate-100 rounded-[20px] p-5 flex flex-col">
      <div class="flex items-center justify-between mb-3">
        <span class="text-[10px] font-extrabold px-3 py-1 rounded-full bg-[#fff0f5] text-[#ff006a] uppercase">${item.type || "WhatsApp Group"}</span>
        <span class="text-[10px] font-bold text-slate-400">${item.category || "General"}</span>
      </div>
      <h3 class="font-extrabold text-[15px] leading-tight mb-2">${item.name || "Unnamed Group"}</h3>
      <p class="text-[12px] text-slate-500 line-clamp-2 mb-4">${item.description || ""}</p>
      <div class="mt-auto">
        <a
          href="${joinUrl}"
          target="_blank"
          rel="noopener noreferrer"
          class="join-button flex-1 text-center py-3 rounded-full bg-slate-900 text-white font-bold text-[13px] hover:bg-black transition block"
        >
          Join Now
        </a>
      </div>
      <div class="text-[9px] text-slate-300 mt-2 truncate">https://zedlinker.store${joinUrl} | field: url</div>
    </div>
    `;
  }).join("") || `<div class="col-span-full text-center py-20 text-slate-400">No links found</div>`;
}

window.render = function(){
  renderItems(allItems);
};

document.getElementById("search").addEventListener("input", ()=>renderItems(allItems));
document.getElementById("filterType").addEventListener("change", ()=>renderItems(allItems));

loadLinks();
</script>
</body>
</html>
