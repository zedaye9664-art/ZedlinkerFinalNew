<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Join WhatsApp Group - ZedLinker</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen p-4">
<div id="app" class="bg-white p-8 rounded-2xl shadow-lg max-w-md w-full text-center">
  <p id="status" class="text-gray-500">Loading Group...</p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCsGgWhJrtuO4sYocovHSbu4LsLY4mtgNs",
  authDomain: "zedlinker-4545.firebaseapp.com",
  projectId: "zedlinker-4545",
  storageBucket: "zedlinker-4545.firebasestorage.app",
  messagingSenderId: "673513119995",
  appId: "1:673513119995:web:f4e2beb6e7e18d3222105e"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const params = new URLSearchParams(window.location.search);
const groupId = params.get("id");
const appDiv = document.getElementById("app");

if(!groupId){
  appDiv.innerHTML = `<h1 class="text-xl font-bold text-red-500">No Group ID Found</h1>`;
} else {
  try {
    const snap = await getDoc(doc(db, "links", groupId));
    if(!snap.exists()){
      appDiv.innerHTML = `<h1 class="text-xl font-bold text-red-500">Group Not Found: ${groupId}</h1>`;
    } else {
      const data = snap.data();
      document.title = data.name + " - ZedLinker";
      appDiv.innerHTML = `
        <h1 class="text-2xl font-bold mb-2">${data.name || 'WhatsApp Group'}</h1>
        <p class="text-sm bg-green-100 text-green-700 inline-block px-3 py-1 rounded-full mb-4">${data.category || 'General'}</p>
        <p class="text-gray-600 mb-6 text-left">${data.description || 'Join this amazing WhatsApp group now!'}</p>
        <a id="joinBtn" href="${data.link}" target="_blank" class="block w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3 rounded-xl transition">
          Join Now on WhatsApp
        </a>
        <p class="text-xs text-gray-400 mt-4">You will be redirected to WhatsApp</p>
      `;
    }
  } catch (e) {
    console.error(e);
    appDiv.innerHTML = `<h1 class="text-red-500">Error: ${e.message}</h1><p class="text-xs mt-2">Rules me allow read: if true; karke Publish karo</p>`;
  }
}
</script>
</body>
</html>
