<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zedlinker Product</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
<div id="app" class="max-w-2xl mx-auto bg-white p-6 rounded-xl shadow mt-6">Loading product...</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCsGgWhJrtuO4sYocovHSbu4LsLY4mtgNs",
  authDomain: "zedlinker-4545.firebaseapp.com",
  projectId: "zedlinker-4545",
  storageBucket: "zedlinker-4545.firebasestorage.app",
  messagingSenderId: "673513119995",
  appId: "1:673513119995:web:f4e2beb6e7e18d3222105e"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const params = new URLSearchParams(window.location.search);
let productId = params.get('id');
if(productId) productId = productId.trim();

const appDiv = document.getElementById('app');

async function load(){
  if(!productId){ 
    appDiv.innerHTML = "<h2 class='text-red-600 font-bold'>ID missing!</h2><p>Use link like: ?id=PRODUCT_ID</p>"; 
    return; 
  }
  try{
    const snap = await getDoc(doc(db, "products", productId));
    if(!snap.exists()){
      appDiv.innerHTML = `<h2 class='text-red-600 font-bold text-xl'>Product Not Found!</h2><p class='mt-2'>ID: <span class='font-mono bg-gray-100 p-1'>${productId}</span></p><p class='mt-2 text-sm'>Ye ID Firebase mein nahi mila. Firebase se Copy ID pe click karo.</p>`;
      return;
    }
    const p = snap.data();
    appDiv.innerHTML = `
      <a href="/" class="text-sm text-blue-600">← Back to Home</a>
      <img src="${p.imageUrl}" class="w-full h-80 object-cover rounded-lg mt-4">
      <h1 class="text-3xl font-bold mt-4">${p.title}</h1>
      <p class="text-green-600 font-bold text-2xl mt-2">Rs. ${p.price}</p>
      <p class="text-gray-600 mt-4 leading-relaxed">${p.description || p.shortDescription || ''}</p>
      <a href="${p.affiliateLink}" target="_blank" class="block bg-orange-500 hover:bg-orange-600 text-white text-center py-4 rounded-xl mt-8 font-bold text-lg">🔥 Buy on Daraz - Best Deal</a>
      <div class="mt-6 text-xs text-gray-400 border-t pt-3">Category: ${p.category||'General'}<br>ID: ${productId}</div>
    `;
  }catch(e){
    appDiv.innerHTML = "<b>Firebase Error:</b> "+e.message;
  }
}
load();
</script>
</body>
</html>
