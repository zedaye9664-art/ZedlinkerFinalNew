<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product - Zedlinker</title>
  <meta name="description" content="Best deals on Zedlinker.store">
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; padding: 16px; max-width: 600px; margin: 0 auto; background: #fff; }
    img { width: 100%; border-radius: 20px; border: 1px solid #eee; }
    .btn { background: linear-gradient(to right, #ec4899, #3b82f6); color: white; padding: 16px 30px; border-radius: 30px; display: block; text-decoration: none; font-weight: bold; margin-top: 20px; text-align: center; font-size: 18px; }
    .badge { background: #f3f4f6; padding: 6px 16px; border-radius: 20px; font-size: 14px; }
    .price { background: #111827; color: white; padding: 6px 16px; border-radius: 20px; font-weight: bold; }
    #share-box { background: #f9fafb; border: 1px dashed #ccc; padding: 12px; border-radius: 12px; margin-top: 20px; font-size: 12px; word-break: break-all; }
  </style>
</head>
<body>
  <a href="/" style="text-decoration:none; color:#111;">← Back to Home</a>
  <div id="product-container" style="margin-top:20px;">Loading product...</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCsGgWhJrtuO4sYocovHSbu4LsLY4mtgNs",
    authDomain: "zedlinker-4545.firebaseapp.com",
    projectId: "zedlinker-4545",
    storageBucket: "zedlinker-4545.firebasestorage.app",
    messagingSenderId: "673513119995",
    appId: "1:673513119995:web:f4e2beb6e7e18d3222105e"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  async function loadProduct() {
    const urlParams = new URLSearchParams(window.location.search);
    const productId = urlParams.get('id');
    
    if(!productId) {
      document.getElementById('product-container').innerHTML = "<h2>Product ID missing!</h2><p>Go back to <a href='/'>home page</a></p>";
      return;
    }

    try {
      const docRef = doc(db, "products", productId);
      const docSnap = await getDoc(docRef);

      if (docSnap.exists()) {
        const p = docSnap.data();
        document.getElementById('product-container').innerHTML = `
          <img src="${p.imageUrl}" alt="${p.title}" />
          <p style="margin-top:16px;"><span class="badge">${p.category || 'Electronics'}</span> <span class="price">Rs ${p.price}</span></p>
          <h1 style="font-size:28px; line-height:1.2; margin-top:10px;">${p.title}</h1>
          <p style="color:#555;">${p.shortDescription || ''}</p>
          <div style="background:#f9fafb; padding:15px; border-radius:15px; margin-top:15px; color:#333; white-space: pre-line;">
            ${p.fullDescription || p.shortDescription || ''}
          </div>
          <a class="btn" href="${p.affiliateLink}" target="_blank">Visit Product - Buy on Daraz</a>
          <div id="share-box">
            <b>Your Final Shareable Link (Copy This):</b><br>
            https://zedlinker.store/product.html?id=${productId}
          </div>
        `;
        document.title = p.title + " - Zedlinker.store";
      } else {
        document.getElementById('product-container').innerHTML = "<h2>Product not found!</h2><p>ID: "+productId+" Firebase mein nahi mila</p>";
      }
    } catch (e) {
      document.getElementById('product-container').innerHTML = "Error: " + e.message;
    }
  }
  loadProduct();
</script>
</body>
  </html>
