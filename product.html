<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Zedlinker</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-gray-50 p-4"><div id="app" class="max-w-2xl mx-auto bg-white p-5 rounded-xl shadow mt-4">Loading All Products...</div><script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";import{getFirestore,doc,getDoc,collection,getDocs}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyCsGgWhJrtuO4sYocovHSbu4LsLY4mtgNs",authDomain:"zedlinker-4545.firebaseapp.com",projectId:"zedlinker-4545",storageBucket:"zedlinker-4545.firebasestorage.app",messagingSenderId:"673513119995",appId:"1:673513119995:web:f4e2beb6e7e18d3222105e"};
const app=initializeApp(firebaseConfig);const db=getFirestore(app);
const params=new URLSearchParams(location.search);let pid=params.get('id');const box=document.getElementById('app');
async function loadAll(){
 const snap=await getDocs(collection(db,"products"));
 if(snap.empty){box.innerHTML="No products found in Firebase!";return;}
 let h="<h2 class='font-bold text-lg'>👇 Apne Product Pe Click Karo (Sahi ID khud ban jayegi):</h2><div class='mt-4 space-y-3'>";
 snap.forEach(d=>{const p=d.data();h+=`<a href='?id=${d.id}' class='block p-3 border-2 rounded-lg hover:bg-blue-50'><img src='${p.imageUrl}' class='w-20 h-20 object-cover rounded float-left mr-3'><b>${p.title}</b><br>Rs.${p.price}<br><span class='text-xs font-mono bg-yellow-100 px-1'>${d.id}</span><div class='clear-both'></div></a>`});
 h+="</div>";box.innerHTML=h;
}
async function loadOne(id){
 try{
  const s=await getDoc(doc(db,"products",id.trim()));
  if(!s.exists()){box.innerHTML=`<h2 class='text-red-600 font-bold'>ID Not Found: ${id}</h2><p class='text-sm mt-2'>Neeche wali list se sahi wale pe click karo:</p>`;await loadAll();return;}
  const p=s.data();box.innerHTML=`<a href='product.html' class='text-sm text-blue-600'>← All Products</a><img src='${p.imageUrl}' class='w-full h-80 object-cover rounded mt-3'><h1 class='text-2xl font-bold mt-3'>${p.title}</h1><p class='text-green-600 font-bold text-xl'>Rs. ${p.price}</p><p class='mt-3 text-gray-600'>${p.description||''}</p><a href='${p.affiliateLink}' target='_blank' class='block bg-orange-500 text-white text-center py-3 rounded mt-5 font-bold'>Buy on Daraz</a><p class='text-xs text-gray-400 mt-4'>ID: ${id}</p>`;
 }catch(e){box.innerHTML="Error: "+e.message+"<br><br>";await loadAll();}
}
if(pid){loadOne(pid);}else{loadAll();}
</script></body></html>
